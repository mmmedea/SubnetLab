 <path d="M406 262c-3 29-26 48-58 48h-34" stroke="#21e6e8" stroke-width="7"/>
 <path d="M325 131l43-61m-23 78 42-60m-66 75 37-53m-151 208-36 49m54-64-34 47m-13-23-26 36" stroke="#20b9f4" stroke-width="3" opacity=".8"/>
 <path d="M341 115l-12 17m-15 5-12 17m-99 130-11 15m-10 12-11 15" stroke="#42e8fa" stroke-width="2"/>
</g>
<g fill="#24e9ee" filter="url(#glow)">
 <circle cx="237" cy="99" r="13"/><circle cx="173" cy="235" r="12"/>
 <circle cx="360" cy="68" r="14"/><circle cx="238" cy="351" r="13"/><circle cx="337" cy="351" r="13"/>
