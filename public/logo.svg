<!-- Diagonal upper terminal and lower terminal -->
<path d="M305 42h113l-79 111H226z" fill="url(#top)"/>
<path d="M191 276h112l-76 107H113z" fill="#07183f"/>
<path d="M191 276h112l-76 107H113z" fill="url(#lower)" opacity=".58"/>
