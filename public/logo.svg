<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="title">
<title id="title">SubnetLab S circuit logo</title>
<defs>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07183f"/><stop offset=".48" stop-color="#0757c7"/><stop offset="1" stop-color="#16c8f2"/></linearGradient>
 <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0755d5"/><stop offset=".48" stop-color="#087ee9"/><stop offset=".82" stop-color="#20e5e6"/><stop offset="1" stop-color="#16a9f1"/></linearGradient>
 <linearGradient id="lower" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#07183f"/><stop offset=".52" stop-color="#0757c7"/><stop offset="1" stop-color="#16c8f2"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Upper angular circuit stroke -->
<path d="M344 42H174c-63 0-106 42-106 99s43 95 106 95h185c38 0 62 20 62 53s-25 55-63 55h-76" fill="none" stroke="url(#top)" stroke-width="66" stroke-linecap="butt"/>
